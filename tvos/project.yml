# XcodeGen spec for the native Apple TV app. Regenerate the project with:
#   cd tvos && xcodegen
name: Bar4Bar
options:
  bundleIdPrefix: app.bar4bar
  deploymentTarget:
    tvOS: "17.0"
packages:
  Bar4BarKit:
    path: Bar4BarKit
targets:
  Bar4Bar:
    type: application
    platform: tvOS
    sources:
      - path: Bar4Bar
    dependencies:
      - package: Bar4BarKit
    scheme:
      testTargets:
        - Bar4BarUITests
    info:
      path: Bar4Bar/Info.plist
      properties:
        CFBundleDisplayName: Bar4Bar
        UIUserInterfaceStyle: Dark
        # Continuity Mic: an iPhone nearby becomes the Apple TV's microphone, so
        # the app can hear what's playing and put the lyrics on the beat by itself.
        NSMicrophoneUsageDescription: >-
          Bar4Bar listens to the room to work out which song is playing and where
          it's up to, so the lyrics stay in time on their own.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bar4bar.tv
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
  # Siri Remote smoke test: focus, the stage, pause, Menu. Screenshots go to the result bundle.
  Bar4BarUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Bar4BarUITests
    dependencies:
      - target: Bar4Bar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.bar4bar.tv.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        GENERATE_INFOPLIST_FILE: YES
