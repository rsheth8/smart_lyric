name: Bar4BarTV
options:
  bundleIdPrefix: com.bar4bar
  deploymentTarget:
    tvOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "3"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TVOS_DEPLOYMENT_TARGET: "17.0"
targets:
  Bar4BarCore:
    type: framework
    platform: tvOS
    sources:
      - path: Bar4BarCore/Sources/Bar4BarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar4bar.core
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_NAME: Bar4BarCore
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  Bar4BarTV:
    type: application
    platform: tvOS
    sources:
      - path: Bar4BarTV
        excludes:
          - "**/*.md"
          - "**/*.xcconfig"
    resources:
      - path: Bar4BarTV/Assets.xcassets
    configFiles:
      Debug: Bar4BarTV/Config/Debug.xcconfig
      Release: Bar4BarTV/Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bar4bar.tv
        INFOPLIST_FILE: Bar4BarTV/Config/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bar4BarTV/Config/Bar4BarTV.entitlements
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        ASSETCATALOG_COMPILER_LAUNCHIMAGE_NAME: ""
        ENABLE_ON_DEMAND_RESOURCES: NO
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: Bar4BarCore
    scheme: {}
    info:
      path: Bar4BarTV/Config/Info.plist
      properties:
        CFBundleDisplayName: Bar4Bar
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIAppFonts: [BarlowCondensed-Bold.ttf, Fraunces.ttf, Fraunces-Italic.ttf, Manrope.ttf]
        UIRequiredDeviceCapabilities: [arm64]
        NSAppleMusicUsageDescription: Bar4Bar uses Apple Music to play your selections and present synchronized lyrics on your TV.
        LYRICS_API_BASE: "$(LYRICS_API_BASE)"
        OFFICIAL_LYRICS_ONLY: "$(OFFICIAL_LYRICS_ONLY)"
        SPOTIFY_FOLLOW_ENABLED: "$(SPOTIFY_FOLLOW_ENABLED)"

  Bar4BarTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Bar4BarTVTests
    dependencies:
      - target: Bar4BarTV
      - target: Bar4BarCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets:
        - Bar4BarTVTests
  Bar4BarTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - path: Bar4BarTVUITests
    dependencies:
      - target: Bar4BarTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets:
        - Bar4BarTVUITests
